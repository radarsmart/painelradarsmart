<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Garimpar — Radar Smart</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 12px;
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        font-size: 13px;
        color: #22223b;
        background: #f8f9fb;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      fieldset {
        border: 1px solid #dcdfe6;
        border-radius: 8px;
        margin: 0 0 10px;
        padding: 8px;
      }
      legend {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        color: #6b7280;
        padding: 0 4px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #6b7280;
        margin: 6px 0 2px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 600;
      }
      .btn-primary {
        background: #1a1a2e;
        color: #fff;
        flex: 1;
      }
      .btn-secondary {
        background: #e5e7eb;
        color: #1a1a2e;
        flex: 1;
      }
      .btn-save {
        background: #ffc300;
        color: #1a1a2e;
        width: 100%;
        margin-top: 6px;
      }
      .btn-send {
        background: #16a34a;
        color: #fff;
        width: 100%;
        margin-top: 8px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        min-height: 16px;
      }
      #status.error {
        color: #dc2626;
      }
      #status.success {
        color: #16a34a;
      }
      #items {
        max-height: 260px;
        overflow-y: auto;
        margin-top: 8px;
      }
      .item {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 6px;
        background: #fff;
      }
      .item-title {
        font-weight: 600;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item-meta {
        font-size: 11px;
        color: #6b7280;
      }
      .item-warn {
        font-size: 11px;
        color: #b45309;
        margin-top: 2px;
      }
      .item input[type="text"] {
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Garimpar — Radar Smart</h1>

    <fieldset>
      <legend>Configuracao</legend>
      <label for="baseUrl">URL do painel</label>
      <input id="baseUrl" type="text" placeholder="https://radarsmart.com.br" />
      <label for="token">Token</label>
      <input id="token" type="password" placeholder="GARIMPAR_API_TOKEN" />
      <label for="mlTag">Etiqueta de afiliado do Mercado Livre</label>
      <input id="mlTag" type="text" placeholder="radarsmart" />
      <button id="saveConfig" class="btn-save">Salvar configuracao</button>
    </fieldset>

    <div class="row">
      <button id="scanDetail" class="btn-primary">Capturar este produto</button>
      <button id="scanList" class="btn-secondary">Capturar esta lista</button>
    </div>

    <div id="items"></div>

    <button id="sendItems" class="btn-send" style="display: none">Enviar para o Radar Smart</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
